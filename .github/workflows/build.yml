name: Build

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile, lint & package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Static analysis (compiler errors & warnings become PR annotations)
        run: ./scripts/lint.sh

      - name: Package
        run: ./scripts/build.sh

      - name: "Smoke: headless UI render"
        run: java -jar build/OmniLauncher.jar --preview build/ui-smoke.png play

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: OmniLauncher-jar
          path: build/OmniLauncher.jar
          retention-days: 14
