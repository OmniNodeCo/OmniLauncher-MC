name: Build OmniLauncher-MC

on:
  workflow_dispatch:

env:
  ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
  ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
  CSC_IDENTITY_AUTO_DISCOVERY: "false"

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Fix node-gyp / Python
        if: runner.os == 'macOS' || runner.os == 'Windows'
        run: python3 -m pip install --break-system-packages --user packaging setuptools

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Cache Electron binaries
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/.cache/electron
            ${{ github.workspace }}/.cache/electron-builder
          key: ${{ runner.os }}-electron-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Setup Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools

      - name: Build renderer + Electron
        run: |
          pnpm build:renderer
          pnpm build
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          NODE_ENV: production
          RELEASE: "true"

      - name: Upload Windows
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: OmniLauncher-MC-Windows
          path: |
            omnilauncher-electron-app/build/output/*.zip
            omnilauncher-electron-app/build/output/*.exe
            omnilauncher-electron-app/build/output/*.appx
            omnilauncher-electron-app/build/output/*.appinstaller
            omnilauncher-electron-app/build/output/*.sha256
            omnilauncher-electron-app/build/output/win-unpacked/

      - name: Upload macOS
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: OmniLauncher-MC-MacOS
          path: |
            omnilauncher-electron-app/build/output/*.dmg
            omnilauncher-electron-app/build/output/*.zip
            omnilauncher-electron-app/build/output/*.sha256
            omnilauncher-electron-app/build/output/mac/
            omnilauncher-electron-app/build/output/mac-arm64/

      - name: Upload Linux
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: OmniLauncher-MC-Ubuntu
          path: |
            omnilauncher-electron-app/build/output/*.AppImage
            omnilauncher-electron-app/build/output/*.deb
            omnilauncher-electron-app/build/output/*.rpm
            omnilauncher-electron-app/build/output/*.tar.xz
            omnilauncher-electron-app/build/output/*.pacman
            omnilauncher-electron-app/build/output/*.sha256
            omnilauncher-electron-app/build/output/linux-unpacked/
            omnilauncher-electron-app/build/output/linux-arm64-unpacked/
