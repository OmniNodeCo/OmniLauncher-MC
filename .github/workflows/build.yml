name: Build

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build
        run: ./scripts/build.sh

      - name: Self-test (includes live HTTP install/runtime pipeline)
        run: java -jar build/OmniLauncher.jar --selftest

      - name: Headless UI smoke render
        run: java -jar build/OmniLauncher.jar --preview preview.png play

      - uses: actions/upload-artifact@v4
        with:
          name: OmniLauncher-jar
          path: build/OmniLauncher.jar
