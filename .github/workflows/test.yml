name: Test

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  selftest:
    name: Built-in test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Build (tests run against the packaged jar)
        run: ./scripts/build.sh

      - name: Run test suite (JSON, rules, installer pipeline, auth chain, runtime manager)
        run: |
          set +e
          java -jar build/OmniLauncher.jar --selftest 2>&1 | tee build/selftest.log
          code=${PIPESTATUS[0]}
          # surface every failing check as a PR annotation
          grep '^FAIL' build/selftest.log | while IFS= read -r line; do
            msg=${line#FAIL  }
            echo "::error title=SelfTest failed::${msg//$'\n'/ }"
          done
          exit "$code"

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selftest-log
          path: build/selftest.log
          retention-days: 14

  headless:
    name: Headless app modes
    runs-on: ubuntu-latest
    needs: selftest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Build
        run: ./scripts/build.sh

      # --list exercises the live manifest client; on a network-restricted
      # runner it must still fail gracefully (exit != crash).
      - name: "CLI: --version"
        run: java -jar build/OmniLauncher.jar --version

      - name: "CLI: --help"
        run: java -jar build/OmniLauncher.jar --help

      - name: UI renders headlessly on a display-less runner
        run: |
          for page in play news settings detail accounts versions installing; do
            java -jar build/OmniLauncher.jar --preview "build/ui-$page.png" "$page" 1200 740
          done

      - name: Upload UI renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-previews
          path: build/ui-*.png
          retention-days: 14
