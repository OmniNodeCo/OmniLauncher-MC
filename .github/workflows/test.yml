name: Test OmniLauncher-MC

on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]

env:
  QT_QPA_PLATFORM: offscreen

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff check
        run: ruff check src/ tests/ --output-format=github

      - name: Run ruff format check
        run: ruff format --check src/ tests/

  typecheck:
    name: Type Check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install mypy
          pip install -e .

      - name: Run mypy
        run: mypy src/omnilauncher/config/ src/omnilauncher/services/ --ignore-missing-imports --no-error-summary || true
        continue-on-error: true

  test:
    name: Test (Python ${{ matrix.python-version }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgl1 libegl1 libxkbcommon0 xvfb

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-asyncio pytest-mock

      - name: Run tests with verbose output
        if: runner.os != 'Linux'
        run: pytest tests/ -v --tb=long --no-header 2>&1

      - name: Run tests with xvfb (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run pytest tests/ -v --tb=long --no-header 2>&1

  syntax:
    name: Syntax Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check all Python files parse correctly
        run: |
          python -c "
          import ast, sys, pathlib
          errors = []
          for f in pathlib.Path('src').rglob('*.py'):
              try:
                  ast.parse(f.read_text(encoding='utf-8'))
              except SyntaxError as e:
                  errors.append(f'{f}: {e}')
          for f in pathlib.Path('tests').rglob('*.py'):
              try:
                  ast.parse(f.read_text(encoding='utf-8'))
              except SyntaxError as e:
                  errors.append(f'{f}: {e}')
          if errors:
              print('SYNTAX ERRORS FOUND:')
              for e in errors:
                  print(f'  {e}')
              sys.exit(1)
          else:
              print('All files have valid Python syntax.')
          "

  import-check:
    name: Import Check
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgl1 libegl1 libxkbcommon0

      - name: Install package
        run: pip install -e .

      - name: Verify all modules import
        run: |
          python -c "
          import sys
          failures = []
          modules = [
              'omnilauncher.config.settings',
              'omnilauncher.services.accounts',
              'omnilauncher.services.instances',
              'omnilauncher.services.java',
              'omnilauncher.services.file_explorer',
              'omnilauncher.services.crash_analyzer',
              'omnilauncher.services.launcher',
              'omnilauncher.services.error_handler',
              'omnilauncher.gui.themes',
          ]
          for mod in modules:
              try:
                  __import__(mod)
                  print(f'  OK  {mod}')
              except Exception as e:
                  print(f'  FAIL {mod}: {e}')
                  failures.append(mod)
          if failures:
              print(f'\n{len(failures)} module(s) failed to import!')
              sys.exit(1)
          else:
              print(f'\nAll {len(modules)} modules imported successfully.')
          "
