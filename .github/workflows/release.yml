name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  gate:
    name: Lint, build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Static analysis gate
        run: ./scripts/lint.sh

      - name: Build
        run: ./scripts/build.sh

      - name: Test gate
        run: |
          java -jar build/OmniLauncher.jar --selftest | tee build/selftest.log
          grep -q "0 failed" build/selftest.log

  package:
    name: Package ${{ matrix.type }} on ${{ matrix.os }}
    needs: gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, type: deb }
          - { os: ubuntu-latest, type: rpm }
          - { os: windows-latest, type: exe }
          - { os: macos-latest, type: dmg }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # jpackage needs WiX 3 (candle/light) on PATH to build exe/msi bundles
      - name: Install WiX toolset
        if: matrix.type == 'exe'
        shell: pwsh
        run: |
          choco install wixtoolset --no-progress -y
          Add-Content $env:GITHUB_PATH 'C:\Program Files (x86)\WiX Toolset v3.14\bin'

      # jpackage needs rpmbuild for --type rpm
      - name: Install rpm tooling
        if: matrix.type == 'rpm'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq rpm

      - name: Package native installer
        run: |
          set -o pipefail
          bash -x ./scripts/package.sh ${{ matrix.type }} 2>&1 | tee build/pkg.log

      - name: Report packaging failure
        if: failure()
        shell: bash
        run: |
          if [ -f build/pkg.log ]; then
            tail -n 25 build/pkg.log | while IFS= read -r line; do
              msg=$(printf '%s' "$line" | cut -c1-380 | tr ',:' '--')
              printf '::error::%s\n' "$msg"
            done
          else
            echo '::error::packaging failed before build/pkg.log existed'
          fi

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: OmniLauncher-${{ matrix.type }}
          path: build/dist/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub release
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: OmniLauncher-*
          path: dist
          merge-multiple: true

      - name: Attach bundles to the release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: dist/**
          generate_release_notes: true
