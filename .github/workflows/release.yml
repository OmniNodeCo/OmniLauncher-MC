name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  gate:
    name: Lint, build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Static analysis gate
        run: ./scripts/lint.sh

      - name: Build
        run: ./scripts/build.sh

      - name: Test gate
        run: |
          java -jar build/OmniLauncher.jar --selftest | tee build/selftest.log
          grep -q "0 failed" build/selftest.log

  package:
    name: Package ${{ matrix.type }} on ${{ matrix.os }}
    needs: gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, type: deb }
          - { os: ubuntu-latest, type: rpm }
          - { os: windows-latest, type: exe }
          - { os: macos-latest, type: dmg }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # the custom exe installer needs Inno Setup 6 (ISCC); preinstalled on
      # runner images, installed via choco when missing
      - name: Install Inno Setup
        if: matrix.type == 'exe'
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }

      # jpackage needs rpmbuild for --type rpm
      - name: Install rpm tooling
        if: matrix.type == 'rpm'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq rpm

      - name: Package native installer
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build
          bash -x ./scripts/package.sh ${{ matrix.type }} 2>&1 | tee build/pkg.log

      - name: Report packaging failure
        if: failure()
        shell: bash
        run: |
          if [ -f build/pkg.log ]; then
            {
              echo "## pkg.log tail"
              tail -n 60 build/pkg.log
              echo "## error patterns"
              grep -inE "error|fail|invalid|not found|no such|exception|denied|cannot|unable|hdiutil|osascript" build/pkg.log | tail -n 20 || true
            } >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
            grep -inE "error|fail|invalid|not found|no such|exception|denied|cannot|unable|hdiutil|osascript" build/pkg.log | tail -n 12 | while IFS= read -r line; do
              printf '::error::%s\n' "$(printf '%s' "$line" | cut -c1-380 | tr ',:' '--')"
            done
            tail -n 60 build/pkg.log | grep -v '^+' | tail -n 12 | while IFS= read -r line; do
              printf '::error::OUT %s\n' "$(printf '%s' "$line" | cut -c1-380 | tr ',:' '--')"
            done
            tail -n 3 build/pkg.log | while IFS= read -r line; do
              printf '::error::TAIL %s\n' "$(printf '%s' "$line" | cut -c1-380 | tr ',:' '--')"
            done
          else
            echo '::error::packaging failed before build/pkg.log existed'
          fi

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: OmniLauncher-${{ matrix.type }}
          path: build/dist/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub release
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: OmniLauncher-*
          path: dist
          merge-multiple: true

      - name: Attach bundles to the release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: dist/**
          generate_release_notes: true
