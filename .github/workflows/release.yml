name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  gate:
    name: Lint, build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Static analysis gate
        run: ./scripts/lint.sh

      - name: Build
        run: ./scripts/build.sh

      - name: Test gate
        run: |
          java -jar build/OmniLauncher.jar --selftest | tee build/selftest.log
          grep -q "0 failed" build/selftest.log

  package:
    name: Package ${{ matrix.type }} on ${{ matrix.os }}
    needs: gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, type: deb }
          - { os: ubuntu-latest, type: rpm }
          - { os: windows-latest, type: exe }
          - { os: macos-latest, type: dmg }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Package native installer
        run: bash ./scripts/package.sh ${{ matrix.type }}
        shell: bash

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: OmniLauncher-${{ matrix.type }}
          path: build/dist/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub release
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: OmniLauncher-*
          path: dist
          merge-multiple: true

      - name: Attach bundles to the release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**
          generate_release_notes: true
