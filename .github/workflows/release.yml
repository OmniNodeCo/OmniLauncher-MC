name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Test, build & publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Static analysis gate
        run: ./scripts/lint.sh

      - name: Build
        run: ./scripts/build.sh

      - name: Test gate
        run: |
          java -jar build/OmniLauncher.jar --selftest | tee build/selftest.log
          grep -q "0 failed" build/selftest.log

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: build/OmniLauncher.jar
          generate_release_notes: true
